name: Lab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/dev.py setup
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t redblue-arena:lab .
      - run: python -m unittest discover -s tests -p test_runner.py -v
        env:
          REDBLUE_DOCKER_TESTS: '1'
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish checked local lab version once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$version" != "0.2.1" ]; then
            echo 'This release job is scoped to the approved 0.2.1 release only.'
            exit 0
          fi
          if gh release view v0.2.1 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'v0.2.1 already published; preserving the existing release.'
            exit 0
          fi
          gh release create v0.2.1 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'RedBlue Arena 0.2.1 — local lab platform' --notes-file RELEASE-NOTES.md
