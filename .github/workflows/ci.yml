name: Lab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check redblue_arena tests
      - run: python -m ruff format --check redblue_arena tests
      - run: python -m unittest discover -s tests -v
      - run: python tests/smoke.py
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: docker build -t redblue-arena:lab .
      - run: python -m unittest discover -s tests -p test_runner.py -v
        env:
          REDBLUE_DOCKER_TESTS: '1'
